<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KGSharks Club — онлайн покер-клуб в Кыргызстане</title>
  <meta name="description" content="40% рейкбэк всем игрокам, +30% к первому депозиту, ежедневные турниры и еженедельный лидерборд. NLH, PLO4, PLO5, AoF в PokerShip. 18+." />
  <meta name="theme-color" content="#12060a" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="KGSharks Club — онлайн покер-клуб в Кыргызстане" />
  <meta property="og:description" content="40% рейкбэк всем игрокам, +30% к первому депозиту, ежедневные турниры и еженедельный лидерборд. NLH, PLO4, PLO5, AoF в PokerShip. 18+." />
  <meta property="og:image" content="logo.jpg" />
  <link rel="icon" href="logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800;900&display=swap" />
  <style>
:root {
  --bg: #12060a;
  --surface: #1f0d13;
  --line: rgba(255,255,255,.10);
  --text: #fff4f5;
  --muted: #c9a9b0;
  --accent: #e3102f;
  --accent2: #9e0b22;
  --accent-text: #ffffff;
  --hi: #8fd3f7;
  --glow: rgba(227,16,47,.28);
  --glow2: rgba(143,211,247,.10);
  --line-strong: rgba(255,255,255,.22);
}
/* Цвета клуба (--bg, --accent, --hi, ...) подставляются сборкой из config.json */
:root {
  --font-head: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --radius: 22px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font: 16px/1.55 var(--font-body);
  background-color: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
}
/* Фон: свечения + «сукно» */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(900px 600px at 85% -5%, var(--glow), transparent 65%),
    radial-gradient(700px 500px at -10% 35%, var(--glow2), transparent 65%),
    radial-gradient(800px 600px at 110% 90%, var(--glow), transparent 70%),
    radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 22px 22px,
    var(--bg);
}
img { max-width: 100%; display: block; }
svg { flex: none; }
h1, h2, h3 { font-family: var(--font-head); line-height: 1.1; margin: 0 0 .5em; letter-spacing: -.02em; }
h1 { font-size: clamp(2.4rem, 7vw, 4.6rem); font-weight: 900; }
h2 { font-size: clamp(1.6rem, 4.2vw, 2.6rem); font-weight: 800; }
h3 { font-size: 1.08rem; font-weight: 700; letter-spacing: -.01em; }
p { margin: 0 0 1em; }
a { color: var(--hi); }
[hidden] { display: none !important; }

.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 20px; }
.narrow { max-width: 780px; }
.center { text-align: center; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.accent { color: var(--hi); }
.grad {
  background: linear-gradient(120deg, var(--text) 0%, var(--hi) 55%, var(--accent) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: .74rem; font-weight: 800; color: var(--hi); margin-bottom: .8em; }
.kicker {
  display: inline-flex; align-items: center; gap: 10px; margin-bottom: 14px;
  text-transform: uppercase; letter-spacing: .16em; font-size: .72rem; font-weight: 800; color: var(--hi);
}
.kicker::before { content: ""; width: 26px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--hi)); }
.sub { color: var(--muted); max-width: 62ch; font-size: 1.05rem; }

/* Появление при прокрутке */
.js .reveal { opacity: 0; transform: translateY(28px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
.js .reveal.is-in { opacity: 1; transform: none; }

/* Кнопки */
.btn {
  position: relative; overflow: hidden; isolation: isolate;
  display: inline-flex; align-items: center; justify-content: center; gap: .55em;
  padding: 15px 28px; border-radius: 16px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: var(--accent-text); font-family: var(--font-body); font-weight: 800; font-size: 1.05rem; text-decoration: none;
  box-shadow: 0 12px 34px -10px var(--accent), inset 0 1px 0 rgba(255,255,255,.25);
  transition: transform .2s var(--ease), box-shadow .2s var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.btn::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
  transform: translateX(-120%);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 18px 44px -10px var(--accent), inset 0 1px 0 rgba(255,255,255,.25); }
.btn:hover::after { transform: translateX(120%); transition: transform .8s var(--ease); }
.btn:active { transform: translateY(0) scale(.99); }
.btn--sm { padding: 10px 18px; font-size: .9rem; border-radius: 12px; box-shadow: none; }
.btn--xl { padding: 19px 36px; font-size: 1.15rem; border-radius: 18px; }
.btn--xl::after { animation: shine 3.6s ease-in-out infinite; }
.btn--block { display: flex; width: 100%; }
/* Рекламный заход: пока данные не сохранены в Firebase, кнопки «Играть» не нажимаются */
.cta-lock a[data-cta] { pointer-events: none; cursor: progress; opacity: .6; filter: saturate(.7); }
.cta-lock a[data-cta]::after { animation: shine 1.1s ease-in-out infinite; }
@keyframes shine { 0%, 55% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }

.tag { display: inline-block; font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 6px; background: var(--accent); color: var(--accent-text); vertical-align: middle; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 14px;
  padding: 7px 12px; border-radius: 999px; font-size: .82rem; font-weight: 700;
  background: color-mix(in srgb, var(--hi) 12%, transparent); color: var(--hi);
  border: 1px solid color-mix(in srgb, var(--hi) 30%, transparent);
}

/* Баннеры */
.demo-banner { background: #ffcc00; color: #000; font-weight: 700; text-align: center; padding: 8px 16px; font-size: .85rem; }
.maint-banner {
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 20px;
  background: linear-gradient(90deg, var(--accent2), var(--accent)); color: var(--accent-text);
  font-weight: 700; font-size: .9rem; text-align: center;
}
.maint-banner svg { width: 18px; height: 18px; }

/* Шапка */
.top {
  position: sticky; top: 0; z-index: 20;
  padding-top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
  border-bottom: 1px solid var(--line);
}
.top__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 11px; color: var(--text); text-decoration: none; font-family: var(--font-head); font-weight: 800; font-size: .98rem; letter-spacing: 0; }
.brand img { width: 42px; height: 42px; border-radius: 50%; box-shadow: 0 0 0 2px var(--hi), 0 0 18px -2px var(--hi); }
.top__right { display: flex; align-items: center; gap: 10px; }
.lang { display: flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.lang button {
  background: transparent; color: var(--muted); border: 0; padding: 6px 10px; border-radius: 9px;
  font: 800 .78rem var(--font-body); letter-spacing: .04em; cursor: pointer; transition: all .2s;
}
.lang button[aria-pressed="true"] { background: var(--hi); color: var(--bg); }
@media (max-width: 440px) { .top .btn--sm { display: none; } }

/* HERO */
.hero { position: relative; padding-block: 56px 36px; overflow: hidden; }
.suits { position: absolute; inset: 0; pointer-events: none; z-index: -1; }
.suits span { position: absolute; font-size: 9rem; line-height: 1; color: var(--hi); opacity: .045; animation: drift 14s ease-in-out infinite; }
.suits span:nth-child(1) { left: 4%; top: 8%; }
.suits span:nth-child(2) { right: 38%; top: 58%; font-size: 6rem; animation-delay: -4s; color: var(--accent); opacity: .07; }
.suits span:nth-child(3) { left: 28%; bottom: -4%; font-size: 7rem; animation-delay: -8s; }
.suits span:nth-child(4) { right: 3%; top: 4%; font-size: 5rem; animation-delay: -2s; color: var(--accent); opacity: .06; }
@keyframes drift { 50% { transform: translateY(-18px) rotate(8deg); } }

.hero__grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; align-items: center; }
.hero h1 { margin-bottom: .3em; }
.lead { font-size: 1.15rem; color: var(--muted); max-width: 46ch; }

/* Ключевые преимущества */
.hl { display: grid; grid-template-columns: 1.25fr 1fr 1fr 1fr; gap: 10px; margin: 26px 0 18px; }
.hl > div {
  border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: center; gap: 2px;
  background: color-mix(in srgb, var(--surface) 80%, transparent); border: 1px solid var(--line);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.hl b { font-family: var(--font-head); font-size: 1.35rem; font-weight: 800; color: var(--hi); line-height: 1.1; }
.hl span { font-size: .84rem; font-weight: 600; color: var(--muted); line-height: 1.3; }
.hl .hl__main {
  background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 38%, var(--surface)), var(--surface));
  border-color: color-mix(in srgb, var(--accent) 60%, transparent);
  box-shadow: 0 16px 40px -18px var(--accent);
}
.hl .hl__main b { font-size: 2.3rem; color: var(--text); }
.hl .hl__main span { color: var(--text); opacity: .85; }
.hero__note { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: .88rem; color: var(--muted); }
.hero__note svg { color: var(--hi); }

/* Логотип с кольцом, фишками и картами */
.hero__art { position: relative; aspect-ratio: 1; max-width: 460px; width: 100%; margin-inline: auto; }
.orb { position: absolute; inset: 8%; border-radius: 50%; }
.orb img { position: relative; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; box-shadow: 0 40px 90px -30px var(--accent); }
.orb__ring {
  position: absolute; inset: -12px; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--hi), transparent 30%, var(--accent) 50%, transparent 75%, var(--hi));
  animation: spin 9s linear infinite; filter: blur(1px);
}
.orb__ring::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--bg); }
.orb::before {
  content: ""; position: absolute; inset: -30%; border-radius: 50%; z-index: -1;
  background: radial-gradient(circle, var(--glow) 0%, transparent 62%);
}
.chip { position: absolute; width: 64px; height: 64px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); animation: float 6s ease-in-out infinite; }
.chip--1 { color: var(--accent); left: -2%; top: 16%; }
.chip--2 { color: var(--hi); right: 0; top: 4%; width: 48px; height: 48px; animation-delay: -2s; }
.chip--3 { color: var(--accent2); right: 4%; bottom: 10%; width: 56px; height: 56px; animation-delay: -4s; }
.card-fan { position: absolute; left: 2%; bottom: 2%; width: 30%; aspect-ratio: 1; animation: float 7s ease-in-out infinite; animation-delay: -1s; }
.pcard {
  position: absolute; left: 20%; bottom: 0; width: 56%; aspect-ratio: 5 / 7; border-radius: 9px;
  background: linear-gradient(160deg, #fff, #e9eef3); color: #111; box-shadow: 0 16px 30px -10px rgba(0,0,0,.6);
  transform: rotate(-14deg); transform-origin: bottom center; display: grid; place-items: center; font-family: var(--font-head);
}
.pcard i { position: absolute; left: 10%; top: 5%; font-style: normal; font-weight: 800; font-size: .95rem; }
.pcard em { font-style: normal; font-size: 2rem; }
.pcard--r { color: #d11a2a; transform: rotate(12deg) translateX(34%); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes float { 50% { transform: translateY(-12px); } }

@media (max-width: 900px) {
  .hero { padding-top: 18px; }
  .hero__grid { grid-template-columns: 1fr; gap: 10px; text-align: center; }
  /* Фишки и карты задаются в процентах от блока с логотипом — тогда вся композиция
     сжимается целиком, как на компьютере, и ничего не налезает на логотип */
  .hero__art { order: -1; max-width: 150px; }
  .chip { width: 14%; height: auto; aspect-ratio: 1; }
  .chip--2 { width: 10.5%; height: auto; }
  .chip--3 { width: 12%; height: auto; }
  .card-fan { width: 26%; left: -13%; bottom: -6%; }
  .chip--1 { left: -9%; }
  .chip--3 { right: -2%; }
  .hero h1 { font-size: clamp(2.1rem, 10vw, 3rem); }
  /* На телефоне кнопка «Играть» — сразу под подзаголовком, преимущества ниже */
  .hero__text { display: flex; flex-direction: column; }
  .hero .btn--xl { order: 1; margin-top: 6px; }
  .hero__note { order: 2; }
  .hl { order: 3; margin: 18px 0 0; }
  .lead { margin-inline: auto; }
  .hl { grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: left; }
  .hl > div { padding: 11px 12px; }
  .hl b { font-size: 1.1rem; }
  .hl span { font-size: .76rem; }
  .hl .hl__main b { font-size: 2rem; }
  .hl .hl__main span { font-size: .9rem; }
  .hl .hl__main { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 14px; }
  .hero .btn--xl { width: 100%; justify-content: center; }
  .hero__note { justify-content: center; text-align: left; }
}
@media (max-width: 360px) { .hl { grid-template-columns: 1fr 1fr; } }

/* Полосы орнамента — включаются в config.json → ornament */
.orn { display: none; }

/* Секции */
.section { padding-block: 60px; }
.card, .tile, .game, .calc, .lb, .steps li, .safety__item, .faq details {
  border: 1px solid transparent; border-radius: var(--radius);
  background:
    linear-gradient(var(--surface), var(--surface)) padding-box,
    linear-gradient(145deg, var(--line-strong), var(--line) 40%, transparent 75%) border-box;
}
.card { padding: 22px; }

/* Бонусы — bento */
.bento { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 8px; }
.tile { padding: 24px; transition: transform .3s var(--ease); }
.tile:hover { transform: translateY(-4px); }
.tile p { color: var(--muted); margin: 0; }
.tile__num { font-family: var(--font-head); font-size: 2.6rem; font-weight: 900; color: var(--hi); line-height: 1; margin-bottom: 14px; }
.tile--hero {
  grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr; column-gap: 32px; align-items: center; padding: 30px 34px;
  background:
    radial-gradient(600px 240px at 0% 50%, color-mix(in srgb, var(--accent) 30%, transparent), transparent) padding-box,
    linear-gradient(var(--surface), var(--surface)) padding-box,
    linear-gradient(120deg, var(--accent), var(--hi) 60%, transparent) border-box;
}
.tile--hero .tile__num { grid-row: 1 / 4; font-size: clamp(4.2rem, 12vw, 7.5rem); margin: 0; }
.tile--hero h3 { font-size: 1.5rem; margin-bottom: .3em; }
.tile--hero .badge { justify-self: start; }
.tile .link { display: inline-block; margin-top: 12px; font-weight: 800; text-decoration: none; }
@media (max-width: 820px) {
  .bento { grid-template-columns: 1fr; }
  .tile--hero { grid-template-columns: 1fr; padding: 26px; }
  .tile--hero .tile__num { grid-row: auto; margin-bottom: 10px; }
}
.terms { list-style: none; padding: 0; margin: 22px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px 22px; }
.terms li { position: relative; padding-left: 22px; color: var(--muted); font-size: .92rem; }
.terms li::before { content: "✓"; position: absolute; left: 0; top: 0; color: var(--hi); font-weight: 900; }

/* Игры */
.games { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 22px 0 18px; }
@media (max-width: 900px) { .games { grid-template-columns: 1fr 1fr; } }
.game { position: relative; overflow: hidden; padding: 24px 22px 22px; min-height: 170px; transition: transform .3s var(--ease); }
.game:hover { transform: translateY(-4px); }
.game h3 { font-size: 1.6rem; font-weight: 900; margin-bottom: .4em; }
.game p { color: var(--muted); margin: 0; font-size: .92rem; position: relative; }
.game__suit { position: absolute; right: -8px; top: -26px; font-size: 7.5rem; line-height: 1; color: var(--hi); opacity: .14; transition: opacity .3s, transform .3s var(--ease); }
.game--red .game__suit { color: #ff4d5e; opacity: .18; }
.game:not(.game--red) .game__suit { color: var(--hi); opacity: .16; }
.game:hover .game__suit { opacity: .22; transform: rotate(-8deg) scale(1.05); }
.platforms { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; color: var(--muted); font-weight: 700; font-size: .9rem; }
.platforms__list { display: flex; flex-wrap: wrap; gap: 8px; }
.platforms__list span { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--text); }

/* Турниры */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 8px; }
.tour h3 { font-size: 1.25rem; }
.tour dl { display: flex; gap: 24px; margin: 14px 0 0; }
.tour dt { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tour dd { margin: 0; font-family: var(--font-head); font-weight: 800; font-size: 1.1rem; }

/* Недельный цикл */
.timeline { list-style: none; padding: 0; margin: 26px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; counter-reset: t; }
.timeline li:not(.timeline__tz) {
  position: relative; padding: 22px 22px 22px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px;
}
.timeline li:not(.timeline__tz)::after {
  content: ""; position: absolute; right: -15px; top: 34px; width: 16px; height: 2px;
  background: linear-gradient(90deg, var(--hi), transparent);
}
.timeline li:nth-child(3)::after { display: none; }
.timeline time { font-family: var(--font-head); font-weight: 800; font-size: .95rem; color: var(--hi); }
.timeline b { font-size: 1.1rem; }
.timeline span { color: var(--muted); font-size: .92rem; }
.timeline li.is-maint { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 20%, var(--surface)), var(--surface) 70%); }
.timeline li.is-maint time { color: var(--text); }
.timeline__tz { grid-column: 1 / -1; color: var(--muted); font-size: .84rem; }
@media (max-width: 820px) {
  .timeline { grid-template-columns: 1fr; gap: 12px; padding-left: 18px; border-left: 2px solid var(--line); }
  .timeline li:not(.timeline__tz)::after { display: none; }
  .timeline li:not(.timeline__tz)::before {
    content: ""; position: absolute; left: -26px; top: 26px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--hi); box-shadow: 0 0 0 4px var(--bg), 0 0 14px var(--hi);
  }
}

/* Лидерборд + джекпот */
.duo { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; align-items: stretch; }
.duo--single { grid-template-columns: 1fr; }
@media (max-width: 900px) { .duo { grid-template-columns: 1fr; } }
.lb { padding: 28px; }
.lb__list { list-style: none; padding: 0; margin: 6px 0 14px; }
.lb__row { display: grid; grid-template-columns: 38px 1fr auto auto; gap: 14px; align-items: center; padding: 12px 10px; border-radius: 14px; }
.lb__row + .lb__row { margin-top: 4px; }
.lb__row--p1, .lb__row--p2, .lb__row--p3 { background: color-mix(in srgb, var(--hi) 6%, transparent); }
.lb__place { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-head); font-weight: 800; font-size: .85rem; background: var(--bg); border: 1px solid var(--line); }
.lb__row--p1 .lb__place { background: linear-gradient(135deg, #ffe07a, #d4a017); color: #3a2800; border: 0; box-shadow: 0 0 18px -2px #f5c542; }
.lb__row--p2 .lb__place { background: linear-gradient(135deg, #f2f5f8, #a9b4bf); color: #1d2630; border: 0; }
.lb__row--p3 .lb__place { background: linear-gradient(135deg, #f0b27a, #a8642c); color: #2e1606; border: 0; }
.lb__name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb__pts { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .92rem; }
.lb__prize { color: var(--hi); font-family: var(--font-head); font-weight: 800; font-size: .92rem; text-align: right; }
@media (max-width: 520px) {
  .lb { padding: 22px 16px; }
  .lb__row { grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 8px; }
  .lb__place { width: 30px; height: 30px; grid-row: span 2; }
  .lb__pts { grid-column: 2; grid-row: 2; font-size: .8rem; }
  .lb__prize { grid-column: 3; grid-row: 1 / 3; align-self: center; }
}
.lb__empty { padding: 18px; border-radius: 14px; border: 1px dashed var(--line-strong); color: var(--muted); text-align: center; }
.note { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: .88rem; margin: 0; }
.note svg { color: var(--hi); margin-top: 3px; }
.jackpot {
  position: relative; overflow: hidden; border-radius: var(--radius); padding: 34px 28px; text-align: center;
  display: flex; flex-direction: column; justify-content: center;
  background: radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--accent) 50%, var(--surface)), var(--surface) 72%);
  border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent);
}
.jackpot__value { font-family: var(--font-head); font-size: clamp(2rem, 6vw, 3rem); font-weight: 900; color: var(--text); text-shadow: 0 0 30px var(--accent); margin: 6px 0 14px; font-variant-numeric: tabular-nums; }
.jackpot p { color: var(--muted); }

/* Рефералка */
.tiers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 24px 0 16px; }
@media (max-width: 600px) { .tiers { grid-template-columns: repeat(2, 1fr); } }
.tier { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 12px; text-align: center; transition: all .3s var(--ease); }
.tier strong { display: block; font-family: var(--font-head); font-size: 2rem; font-weight: 900; color: var(--muted); transition: color .3s; }
.tier span { color: var(--muted); font-size: .88rem; font-weight: 600; }
.tier.is-active { border-color: var(--hi); background: color-mix(in srgb, var(--hi) 12%, var(--surface)); transform: translateY(-4px); box-shadow: 0 16px 36px -18px var(--hi); }
.tier.is-active strong { color: var(--hi); }
.ref-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; margin-bottom: 22px; }
@media (max-width: 860px) { .ref-grid { grid-template-columns: 1fr; } }
.calc { padding: 26px; display: grid; gap: 16px; }
.calc h3 { margin: 0; }
.calc label { display: grid; gap: 8px; font-weight: 700; font-size: .9rem; color: var(--muted); }
.range { display: flex; align-items: center; gap: 14px; }
.range output { min-width: 2ch; font-family: var(--font-head); font-size: 1.5rem; font-weight: 800; color: var(--text); }
.calc input[type=range] {
  flex: 1; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 8px; outline-offset: 6px;
  background: linear-gradient(90deg, var(--accent), var(--hi)) 0 / var(--p, 14%) 100% no-repeat, var(--line);
}
.calc input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--text); border: 4px solid var(--hi); box-shadow: 0 0 14px var(--hi); cursor: pointer; }
.calc input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--text); border: 4px solid var(--hi); cursor: pointer; }
.calc input[type=number] {
  width: 100%; padding: 13px 15px; border-radius: 14px; border: 1px solid var(--line-strong);
  background: var(--bg); color: var(--text); font: 700 1.1rem var(--font-body);
}
.calc input:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
.calc__result { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding: 16px 18px; border-radius: 16px; background: var(--bg); }
.calc__result span { color: var(--muted); font-weight: 600; width: 100%; font-size: .9rem; }
.calc__result strong { font-family: var(--font-head); font-size: 2rem; color: var(--hi); font-weight: 900; }
.calc__result small { color: var(--muted); font-weight: 700; }
.calc p { margin: 0; }
.ref-steps { list-style: none; margin: 0; padding: 26px; counter-reset: r; display: grid; gap: 16px; align-content: center; border-radius: var(--radius); border: 1px dashed var(--line-strong); }
.ref-steps li { counter-increment: r; display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: center; font-weight: 600; }
.ref-steps li::before { content: counter(r); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-head); font-weight: 800; font-size: .85rem; background: color-mix(in srgb, var(--hi) 14%, transparent); color: var(--hi); border: 1px solid color-mix(in srgb, var(--hi) 40%, transparent); }

/* Шаги */
.steps { list-style: none; padding: 0; margin: 22px 0 0; counter-reset: s; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 820px) { .steps { grid-template-columns: 1fr; } }
.steps li { counter-increment: s; padding: 26px; display: grid; gap: 6px; align-content: start; }
.steps li::before {
  content: counter(s); width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-text);
  font-family: var(--font-head); font-weight: 900; font-size: 1.2rem; box-shadow: 0 10px 24px -10px var(--accent);
}
.steps b { font-size: 1.08rem; }
.steps span { color: var(--muted); }

/* Правила и безопасность */
.safety { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 820px) { .safety { grid-template-columns: 1fr; } }
.safety__item { display: flex; gap: 14px; padding: 22px; align-items: flex-start; }
.safety__item svg { width: 26px; height: 26px; color: var(--hi); margin-top: 2px; }
.safety__item div { display: grid; gap: 4px; }
.safety__item span { color: var(--muted); font-size: .92rem; }
.safety__item--warn svg { color: #ffc24a; }

/* FAQ */
.faq details { margin-bottom: 10px; transition: background .3s; }
.faq summary { cursor: pointer; padding: 18px 20px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after {
  content: "+"; flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: color-mix(in srgb, var(--hi) 14%, transparent); color: var(--hi); font-size: 1.2rem; transition: transform .3s var(--ease);
}
.faq details[open] summary::after { transform: rotate(45deg); }
.faq details p { padding: 0 20px 18px; margin: 0; color: var(--muted); }

/* Финал */
.final__box {
  position: relative; overflow: hidden; padding: 52px 28px; border-radius: 30px;
  background:
    radial-gradient(500px 260px at 50% 0%, color-mix(in srgb, var(--accent) 40%, transparent), transparent) padding-box,
    linear-gradient(var(--surface), var(--surface)) padding-box,
    linear-gradient(135deg, var(--accent), var(--hi)) border-box;
  border: 1px solid transparent;
}
.final__box .sub { margin-inline: auto; }
.final__box .hero__note { justify-content: center; }

/* Подвал */
.foot { border-top: 1px solid var(--line); padding-block: 30px; color: var(--muted); font-size: .9rem; }
.foot__row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
.foot__row p { margin: 0 0 6px; }
.foot__group { font-weight: 800; text-decoration: none; }
.age { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--muted); font-weight: 800; font-size: .75rem; margin-right: 6px; }

/* Нижняя кнопка на телефоне */
.sticky {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  transform: translateY(110%); transition: transform .3s var(--ease);
}
.sticky.is-shown { transform: none; }
.sticky .btn { font-size: 1rem; padding: 15px 16px; }
@media (min-width: 900px) { .sticky { display: none; } body { padding-bottom: 0; } }

/* Переход в Telegram */
.leaving {
  position: fixed; inset: 0; z-index: 50; display: none; place-items: center; align-content: center; gap: 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); font-weight: 700;
}
body.is-leaving .leaving { display: grid; }
.spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--hi); animation: spin .8s linear infinite; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
  .js .reveal { opacity: 1; transform: none; }
}

/* Лимиты под играми */
.stakes { margin: 0 0 18px; color: var(--muted); font-weight: 700; font-size: .92rem; }

/* Лидерборд: итог, период, вкладки групп лимитов */
.lb-head { display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px; margin: 22px 0 14px; }
.lb-total {
  display: grid; gap: 2px; padding: 16px 22px; border-radius: 18px; min-width: 220px;
  background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 34%, var(--surface)), var(--surface));
  border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
}
.lb-total span { font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.lb-total b { font-family: var(--font-head); font-size: 1.9rem; font-weight: 900; line-height: 1.1; }
.lb-total small { color: var(--hi); font-weight: 700; }
.lb-period {
  flex: 1; min-width: 220px; display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-radius: 18px;
  background: var(--surface); border: 1px solid var(--line); font-weight: 700;
}
.lb-period svg { color: var(--hi); }
.lb-tabs { display: flex; gap: 6px; padding: 5px; margin-bottom: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); overflow-x: auto; }
.lb-tabs button {
  flex: 1; white-space: nowrap; padding: 11px 14px; border: 0; border-radius: 12px; cursor: pointer;
  background: transparent; color: var(--muted); font: 800 .9rem var(--font-body); transition: all .2s;
}
.lb-tabs button[aria-selected="true"] { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-text); box-shadow: 0 8px 20px -10px var(--accent); }
.lb .lb__list { margin: 0; }
.lb__prize small { display: block; font-family: var(--font-body); font-weight: 600; font-size: .74rem; color: var(--muted); }
.lb__name { color: var(--muted); font-weight: 600; }
.lb__row--p1 .lb__name, .lb__row--p2 .lb__name, .lb__row--p3 .lb__name { color: var(--text); font-weight: 700; }
.lb__more { margin: 10px 0 0; text-align: center; color: var(--muted); font-size: .86rem; }
#leaderboard .note { margin-top: 14px; }

/* Джекпот */
.jp-grid > * { min-width: 0; }
.jp-grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 14px; margin-top: 8px; }
@media (max-width: 900px) { .jp-grid { grid-template-columns: 1fr; } }
.jackpot { text-align: left; justify-content: flex-start; gap: 4px; }
.jackpot .eyebrow { margin-bottom: 0; }
.jackpot__value { margin: 4px 0 2px; }
.jackpot__lead { color: var(--text) !important; font-size: 1.02rem; margin: 10px 0 16px; }
.jp-split { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.jp-split div { padding: 14px 10px; border-radius: 14px; text-align: center; background: color-mix(in srgb, var(--bg) 55%, transparent); border: 1px solid var(--line); }
.jp-split b { display: block; font-family: var(--font-head); font-size: 1.6rem; font-weight: 900; color: var(--hi); }
.jp-split div:first-child b { color: var(--text); text-shadow: 0 0 20px var(--accent); }
.jp-split span { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); overflow-wrap: anywhere; hyphens: auto; }
.jp-info { padding: 26px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
.jp-table-wrap { overflow-x: auto; margin: 6px 0 8px; }
.jp-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.jp-table th, .jp-table td { padding: 11px 10px; border-bottom: 1px solid var(--line); text-align: center; }
.jp-table thead th { font-size: .72rem; line-height: 1.3; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 800; }
.jp-table tbody th { text-align: left; font-family: var(--font-head); font-weight: 800; }
.jp-table td { font-weight: 800; color: var(--hi); font-variant-numeric: tabular-nums; }
.jp-table tr:last-child th, .jp-table tr:last-child td { border-bottom: 0; }
.terms--one { grid-template-columns: 1fr; margin-top: 16px; }
@media (max-width: 520px) {
  .lb-total, .lb-period { min-width: 0; flex: 1 1 100%; }
  .jp-split b { font-size: 1.3rem; }
  .jp-split div { padding: 12px 6px; }
  .jp-split span { font-size: .72rem; }
  .jp-info { padding: 20px 16px; }
}

/* Турниры */
.tour { display: flex; flex-direction: column; gap: 8px; padding: 24px; transition: transform .3s var(--ease); }
.tour:hover { transform: translateY(-4px); }
.tour h3 { margin: 0; font-size: 1.2rem; }
.tour__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tour__type { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--hi); }
.tour--ko { background:
    radial-gradient(420px 200px at 100% 0%, color-mix(in srgb, var(--accent) 28%, transparent), transparent) padding-box,
    linear-gradient(var(--surface), var(--surface)) padding-box,
    linear-gradient(135deg, var(--accent), var(--line) 60%) border-box; }
.tour--free .tour__type { color: #7ee08a; }
.tour__when { margin: 0; color: var(--muted); font-size: .92rem; }
.tour__when b { color: var(--text); }
.tour dl { flex-wrap: wrap; gap: 14px 24px; margin: 6px 0 0; }
.tour dd small { display: block; font-family: var(--font-body); font-weight: 600; font-size: .74rem; color: var(--muted); }
.tour__note { margin: auto 0 0; padding-top: 10px; border-top: 1px dashed var(--line-strong); color: var(--muted); font-size: .86rem; }
.cards { grid-template-columns: repeat(auto-fit, minmax(250px, 320px)); justify-content: center; }

/* Столы — живые данные из Firebase */
.section[hidden] { display: none; }
.tstats { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px; margin: 22px 0 14px; }
.tstat { display: flex; flex-direction: column; justify-content: center; padding: 12px 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); color: var(--text); text-decoration: none; }
.tstat b { font-family: var(--font-head); font-size: 1.35rem; font-weight: 900; line-height: 1.1; }
.tstat span { color: var(--muted); font-size: .8rem; font-weight: 700; }
.tstat--jp { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--surface)), var(--surface)); transition: transform .3s var(--ease); }
.tstat--jp:hover { transform: translateY(-2px); }
.tstat--jp b { color: var(--hi); }
.tlive { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 0 auto; align-self: center; color: var(--muted); font-size: .85rem; font-weight: 700; }
.tlive i { width: 9px; height: 9px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 0 rgba(61,220,132,.6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(61,220,132,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); } }
.ttabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.ttabs:empty { display: none; }
.ttabs button { font: 700 .88rem var(--font-head); padding: 8px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; transition: color .2s, border-color .2s, background .2s; }
.ttabs button:hover { color: var(--text); border-color: var(--line-strong); }
.ttabs button[aria-pressed="true"] { color: var(--accent-text); background: var(--accent); border-color: var(--accent); }
.tbls { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 290px)); justify-content: center; gap: 14px; }
.tbl {
  position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 20px; border: 1px solid transparent; border-radius: var(--radius);
  background:
    radial-gradient(260px 140px at 100% 0%, color-mix(in srgb, var(--hi) 12%, transparent), transparent) padding-box,
    linear-gradient(var(--surface), var(--surface)) padding-box,
    linear-gradient(145deg, var(--line-strong), var(--line) 40%, transparent 75%) border-box;
  transition: transform .3s var(--ease);
}
.tbl:hover { transform: translateY(-4px); }
.tbl--hot { background:
    radial-gradient(260px 140px at 100% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent) padding-box,
    linear-gradient(var(--surface), var(--surface)) padding-box,
    linear-gradient(145deg, var(--accent), var(--line) 45%, transparent 80%) border-box; }
.tbl__suit { position: absolute; right: -6px; top: -22px; font-size: 6.5rem; line-height: 1; color: var(--hi); opacity: .09; pointer-events: none; transition: opacity .3s, transform .3s var(--ease); }
.tbl:hover .tbl__suit { opacity: .18; transform: rotate(-8deg) scale(1.05); }
.tbl__top { position: relative; display: flex; flex-direction: column; gap: 4px; }
.tbl__game { align-self: flex-start; font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--hi); }
.tbl__name { font-weight: 700; color: var(--muted); font-size: .88rem; }
.tbl__blinds small { display: block; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tbl__blinds b { display: block; font-family: var(--font-head); font-size: 1.7rem; font-weight: 900; line-height: 1.15; white-space: nowrap; }
.tbl__blinds span { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); }
.tbl__seats { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tbl__seats b { font-family: var(--font-head); font-size: .95rem; }
.tbl__dots { display: flex; gap: 6px; }
.tbl__dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); }
.tbl__dots i.on { border-color: transparent; background: linear-gradient(135deg, var(--hi), var(--accent)); box-shadow: 0 0 10px var(--glow2); }
.tbl__status { margin: -6px 0 0; font-size: .82rem; font-weight: 700; color: var(--muted); }
.tbl--hot .tbl__status { color: #3ddc84; }
.tbl--full { opacity: .75; }
.tbl .btn { margin-top: auto; }
.tnote { margin: 16px 0 0; color: var(--muted); font-size: .85rem; }
@media (max-width: 560px) {
  .tstat { flex: 1 1 40%; }
  .tlive { margin: 4px 0 0; flex-basis: 100%; }
  .tbls { grid-template-columns: 1fr 1fr; gap: 10px; }
  .tbl { padding: 16px; gap: 12px; }
  .tbl__blinds b { font-size: 1.25rem; }
  .tbl__dots { gap: 4px; }
  .tbl__dots i { width: 11px; height: 11px; }
}
@media (max-width: 360px) { .tbls { grid-template-columns: 1fr; } }

/* Быстрый переход по разделам */
.snav { position: relative; border-top: 1px solid var(--line); }
.snav__track { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 16px; scroll-padding-inline: 16px;
  -webkit-mask: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 28px), transparent 100%);
          mask: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 28px), transparent 100%); }
.snav__track::-webkit-scrollbar { display: none; }
@media (min-width: 900px) { .snav__track { justify-content: center; -webkit-mask: none; mask: none; } }
.snav a { position: relative; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px;
  font: 700 .84rem/1 var(--font-body); color: var(--muted); text-decoration: none; white-space: nowrap;
  border: 1px solid transparent; transition: color .25s var(--ease), background .25s var(--ease), border-color .25s var(--ease), transform .2s var(--ease); }
.snav a svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.snav a:hover { color: var(--text); background: color-mix(in srgb, var(--surface) 70%, transparent); border-color: var(--line); }
.snav a:active { transform: scale(.96); }
.snav a[aria-current="true"] { color: var(--accent-text); background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: 0 8px 22px -10px var(--accent), inset 0 1px 0 rgba(255,255,255,.2); }
.snav a[aria-current="true"] svg { opacity: 1; }
.snav__live { width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 0 rgba(61,220,132,.6); animation: pulse 2s infinite; }
.snav__progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; transform-origin: 0 50%; transform: scaleX(var(--p, 0));
  background: linear-gradient(90deg, var(--accent), var(--hi)); pointer-events: none; }
main section[id] { scroll-margin-top: 124px; }

/* Главный турнир недели — широкой карточкой */
.tour--main {
  grid-column: 1 / -1; display: grid; grid-template-columns: 1.1fr auto; align-items: center; gap: 10px 28px;
  background:
    radial-gradient(520px 220px at 0% 0%, color-mix(in srgb, var(--accent) 26%, transparent), transparent) padding-box,
    linear-gradient(var(--surface), var(--surface)) padding-box,
    linear-gradient(120deg, var(--accent), var(--hi) 60%, transparent) border-box;
}
.tour--main .tour__top, .tour--main h3, .tour--main .tour__when { grid-column: 1; }
.tour--main h3 { font-size: 1.75rem; }
.tour--main .tour__type { color: var(--text); }
.tour--main dl { grid-column: 2; grid-row: 1 / 4; margin: 0; gap: 10px 30px; }
.tour--main dd { font-size: 1.45rem; }
.tour--main .tour__note { grid-column: 1 / -1; }
@media (max-width: 820px) {
  .tour--main { grid-template-columns: 1fr; }
  .tour--main h3 { font-size: 1.35rem; }
  .tour--main dl { grid-column: 1; grid-row: auto; }
  .tour--main dd { font-size: 1.2rem; }
}

/* Призовая тройка лидерборда — золото, серебро, бронза */
.lb__row--p1, .lb__row--p2, .lb__row--p3 { position: relative; overflow: hidden; }
.lb__row--p1 { background: linear-gradient(90deg, color-mix(in srgb, #f5c542 16%, transparent), transparent 70%); }
.lb__row--p2 { background: linear-gradient(90deg, color-mix(in srgb, #cfd8e3 13%, transparent), transparent 70%); }
.lb__row--p3 { background: linear-gradient(90deg, color-mix(in srgb, #e08b4c 13%, transparent), transparent 70%); }
.lb__row--p1::before, .lb__row--p2::before, .lb__row--p3::before { content: ""; position: absolute; left: 0; top: 8%; bottom: 8%; width: 3px; border-radius: 3px; }
.lb__row--p1::before { background: linear-gradient(#ffe07a, #d4a017); }
.lb__row--p2::before { background: linear-gradient(#f2f5f8, #a9b4bf); }
.lb__row--p3::before { background: linear-gradient(#f0b27a, #a8642c); }
.lb__row--p1 .lb__prize { color: #ffd76a; }
.lb__row--p1 .lb__place { animation: medal 3.5s ease-in-out infinite; }
@keyframes medal { 50% { box-shadow: 0 0 26px 2px #f5c542; } }

/* Появление карточек столов и подсветка изменившихся */
.tbl { animation: tblIn .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes tblIn { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.tbl--upd { animation: tblIn .45s var(--ease) both, tblUpd 2.4s var(--ease) 1; }
@keyframes tblUpd { 0%, 100% { box-shadow: none; } 25% { box-shadow: 0 0 0 2px color-mix(in srgb, var(--hi) 60%, transparent), 0 0 30px -6px var(--hi); } }
.tbl__suit--red { color: #ff4d5e; }
@media (prefers-reduced-motion: reduce) {
  .tbl, .tbl--upd { animation: none; }
  .lb__row--p1 .lb__place { animation: none; }
}

/* Заглушка карточек игр, пока столы не пришли из Firebase */
.game--wait { min-height: 170px; background: var(--surface); border: 1px dashed var(--line-strong); opacity: .5; animation: wait 1.4s ease-in-out infinite; }
.game--wait:nth-child(2) { animation-delay: .15s; }
.game--wait:nth-child(3) { animation-delay: .3s; }
@keyframes wait { 50% { opacity: .22; } }
@media (prefers-reduced-motion: reduce) { .game--wait { animation: none; } }

  $('lbTabs').addEventListener('click', function (e) {

    if (!btn) return;

  $('langSwitch').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-lang]');

  renderAll();
  setInterval(renderData, 60000); // баннер техработ и этап лидерборда без перезагрузки
  loadLive();

  // Плавное появление секций
  var reveals = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); } });
    }, { rootMargin: '0px 0px -8% 0px' });

    sticky.classList.add('is-shown');
  }

  <script type="module">
// ========================================
// СБОР ДАННЫХ ДЛЯ EMQ + FIREBASE
// Формат записи в <club>_fbclids/<shortId> совпадает со старой прокладкой,
// поэтому бот (/start <shortId> → Conversions API) работает без изменений.
// Отличия от старой версии:
//  - рекламный заход: кнопки заблокированы (класс cta-lock ставится ещё в <head>), пока запись
//    с IP/гео не сохранится в Firebase; затем кнопки включаются со ссылкой ?start=<shortId>.
//    Как и раньше, при ошибке Firebase кнопки всё равно включаются — игрок не должен застрять;
//  - базовая запись уходит сразу, IP/гео дописываются следом (запись есть, даже если человек ушёл);
//  - IP и гео одним запросом (ipinfo / ipapi параллельно), с таймаутами;
//  - заходы без fbclid тоже пишутся — в отдельную ветку <club>_visits;
//  - все кнопки с data-cta ведут в бота через один и тот же shortId.
// ========================================
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, set } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const C = window.CLUB;
const T = C.tracking;
const PAGE_LOAD_TIME = window.PAGE_LOAD_TIME || Date.now();

const database = getDatabase(initializeApp(T.firebase));

// ---------- helpers ----------
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const params = new URLSearchParams(window.location.search);

// 8 символов [a-z0-9] — тот же формат, что ждёт бот. Криптослучайные, чтобы shortId нельзя было угадать.
function generateShortId() {
  const abc = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const bytes = new Uint8Array(8);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
  else for (let i = 0; i < 8; i++) bytes[i] = Math.floor(Math.random() * 256);
  return Array.from(bytes, (b) => abc[b % 36]).join('');
}

function withTimeout(promise, ms, label) {
  return Promise.race([promise, wait(ms).then(() => { throw new Error(label + ' timeout'); })]);
}

function logError(errorType, errorMessage, extraData = {}) {
  const errorId = `${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
  set(ref(database, `${T.errorsBranch}/${errorId}`), {
    error_type: errorType,
    error_message: String(errorMessage),
    timestamp: Date.now(),
    timestamp_readable: new Date().toISOString(),
    url: window.location.href,
    user_agent: navigator.userAgent,
    ...extraData
  }).catch(() => {});
}

function writeRecord(path, data) {
  return withTimeout(set(ref(database, path), data), 5000, 'Firebase');
}

// ---------- Facebook cookies ----------
function getFacebookBrowserPixel() {
  const match = document.cookie.match(/(?:^|; )_fbp=([^;]+)/);
  if (match) return match[1];
  const fbp = `fb.2.${Date.now()}.${Math.random().toString().substring(2)}${Math.random().toString().substring(2)}`;
  document.cookie = `_fbp=${fbp}; max-age=7776000; path=/`;
  return fbp;
}

function getFacebookClickCookie() {
  const trackingId = params.get('fbclid') || params.get('brid');
  if (trackingId) {
    const fbc = `fb.2.${Date.now()}.${trackingId}`;
    document.cookie = `_fbc=${fbc}; max-age=7776000; path=/`;
    return fbc;
  }

// ---------- browser / utm / performance ----------
function collectBrowserMetadata() {
  const ua = navigator.userAgent;
  const conn = navigator.connection;
  const isMobile = /Mobile|Android|iPhone|iPad|iPod/i.test(ua);
  const isTablet = /iPad|Android.*Tablet/i.test(ua);
  return {
    user_agent: ua,
    language: navigator.language || navigator.userLanguage,
    languages: navigator.languages ? navigator.languages.join(',') : navigator.language,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    timezone_offset: new Date().getTimezoneOffset(),
    platform: navigator.platform,
    vendor: navigator.vendor,
    device_type: isMobile ? 'mobile' : (isTablet ? 'tablet' : 'desktop'),
    is_mobile: isMobile,
    is_tablet: isTablet,
    is_desktop: !isMobile,
    is_touch: ('ontouchstart' in window) || (navigator.maxTouchPoints > 0),

    cpu_cores: navigator.hardwareConcurrency || null,
    screen_width: window.screen.width,
    screen_height: window.screen.height,
    screen_available_width: window.screen.availWidth,
    screen_available_height: window.screen.availHeight,
    color_depth: window.screen.colorDepth,
    pixel_depth: window.screen.pixelDepth,
    viewport_width: window.innerWidth,
    viewport_height: window.innerHeight,
    connection_type: conn ? conn.effectiveType : null,
    connection_downlink: conn ? conn.downlink : null,
    connection_rtt: conn ? conn.rtt : null,
    cookies_enabled: navigator.cookieEnabled,
    do_not_track: navigator.doNotTrack || window.doNotTrack || navigator.msDoNotTrack || null

}

function collectUTMParameters() {
  return {
    utm_source: params.get('utm_source'),
    utm_medium: params.get('utm_medium'),
    utm_campaign: params.get('utm_campaign'),
    utm_content: params.get('utm_content'),
    utm_term: params.get('utm_term'),
    utm_id: params.get('utm_id'),

    ttclid: params.get('ttclid'),

}

function getPerformanceMetrics() {
  const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
  if (!nav) return {};
  const ms = (v) => (v > 0 ? Math.round(v) : null);
  return {
    page_load_time: ms(nav.loadEventEnd),
    dom_ready_time: ms(nav.domContentLoadedEventEnd),
    dns_time: Math.round(nav.domainLookupEnd - nav.domainLookupStart),
    tcp_time: Math.round(nav.connectEnd - nav.connectStart),
    request_time: Math.round(nav.responseEnd - nav.requestStart),
    response_time: Math.round(nav.responseEnd - nav.responseStart)
  };
}

// ---------- IP + geo ----------
function fetchJson(url, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  return fetch(url, { cache: 'no-store', signal: controller.signal })
    .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .finally(() => clearTimeout(timer));
}

const regionNames = (() => {
  try { return new Intl.DisplayNames(['en'], { type: 'region' }); } catch (_) { return null; }
})();

async function getIpAndGeo() {
  const withGeo = [
    fetchJson('https://ipinfo.io/json', 4000).then((d) => {
      if (!d.ip) throw new Error('no ip');
      const [lat, lon] = (d.loc || '').split(',');
      return {
        ip: d.ip,
        country: d.country && regionNames ? regionNames.of(d.country) : null,
        country_code: d.country || null,
        city: d.city || null,
        region: d.region || null,
        postal_code: d.postal || null,
        latitude: lat ? Number(lat) : null,
        longitude: lon ? Number(lon) : null,
        timezone: d.timezone || null
      };
    }),
    fetchJson('https://ipapi.co/json/', 4000).then((d) => {
      if (!d.ip) throw new Error('no ip');
      return {
        ip: d.ip,
        country: d.country_name || null,
        country_code: d.country_code || null,
        city: d.city || null,
        region: d.region || null,
        postal_code: d.postal || null,
        latitude: d.latitude || null,
        longitude: d.longitude || null,
        timezone: d.timezone || null
      };
    })
  ];
  try {
    return await Promise.any(withGeo);
  } catch (_) {
    // Гео недоступно — хотя бы IP
    try {
      const ip = await Promise.any([
        fetchJson('https://api.ipify.org?format=json', 3000).then((d) => d.ip || Promise.reject()),
        fetchJson('https://api.ip.sb/jsonip', 3000).then((d) => d.ip || Promise.reject())
      ]);
      return { ip };
    } catch (_) {
      return null;
    }
  }
}

function networkFields(net) {

function buildRecord(trackingId, paramType) {
  const now = Date.now();
  const perf = getPerformanceMetrics();
  // Firebase не принимает undefined — всё приводим к null
  const record = {
    fbclid: trackingId ? `fb.1.${now}.${trackingId}` : null,
    fbclid_original: trackingId || null,
    parameter_type: paramType,
    fbc: getFacebookClickCookie(),
    fbp: getFacebookBrowserPixel(),
    timestamp: now,
    timestamp_readable: new Date(now).toISOString(),
    url: window.location.href,
    referrer: document.referrer || 'direct',
    club: C.id,
    site_lang: document.documentElement.lang,
    ...collectUTMParameters(),
    ...collectBrowserMetadata(),
    ...networkFields(null),
    page_load_time: perf.page_load_time ?? null,
    dom_ready_time: perf.dom_ready_time ?? null,
    dns_time: perf.dns_time ?? null,
    tcp_time: perf.tcp_time ?? null,
    request_time: perf.request_time ?? null,
    response_time: perf.response_time ?? null,
    button_clicked: false,
    page_visible: !document.hidden,
    has_focus: document.hasFocus()
  };
  Object.keys(record).forEach((k) => { if (record[k] === undefined) record[k] = null; });
  return record;
}

// ---------- last ad snapshot (как в старой прокладке) ----------
function saveLastAdSnapshot() {
  if (!state.shortId || !state.record || !state.record.fbclid_original) return;
  try {
    localStorage.setItem(T.storageKey, JSON.stringify({
      short_id: state.shortId,
      tracking_id: state.trackingId,
      parameter_type: state.paramType,
      firebase_data: state.record,
      updated_at: new Date().toISOString()
    }));
  } catch (_) {}
}

function loadLastAdSnapshot() {
  try {
    const raw = localStorage.getItem(T.storageKey);
    if (!raw) return null;
    const s = JSON.parse(raw);
    const shortId = typeof s?.short_id === 'string' ? s.short_id.trim() : '';
    const data = s?.firebase_data;
    if (!/^[a-z0-9]{6,32}$/i.test(shortId) || !data || typeof data !== 'object' || !data.fbclid_original) {
      localStorage.removeItem(T.storageKey);
      return null;
    }
    return {
      shortId,
      trackingId: s.tracking_id || data.fbclid_original,
      paramType: s.parameter_type || data.parameter_type || 'fbclid',
      record: data
    };
  } catch (_) {
    try { localStorage.removeItem(T.storageKey); } catch (__) {}
    return null;
  }
}

// ---------- state ----------
const state = {
  shortId: null,       // идёт в ?start= бота (только рекламные заходы)
  trackingId: null,
  paramType: null,
  record: null,        // запись в <club>_fbclids
  path: null,          // куда пишем запись
  netReady: Promise.resolve()
};

function botLink() {
  return `https://t.me/${C.bot}?start=${state.shortId || T.noTrackingStart}`;
}

function applyLinks() {
  const href = botLink();
  document.querySelectorAll('a[data-cta]').forEach((a) => { a.href = href; });
}

function fbqCustom(name, data) {
  if (typeof window.fbq === 'function') window.fbq('trackCustom', name, data);
}

// ---------- main ----------
const trackingId = params.get('fbclid') || params.get('brid');
const paramType = params.get('fbclid') ? 'fbclid' : (params.get('brid') ? 'brid' : 'none');
const fullUrl = window.location.href;

if (trackingId) {
  state.shortId = generateShortId();
  state.trackingId = trackingId;
  state.paramType = paramType;
  state.path = `${T.adBranch}/${state.shortId}`;
  state.record = buildRecord(trackingId, paramType);
  saveLastAdSnapshot();

  fbqCustom('ProkladkaWithFbclid', {
    tracking_id: trackingId,
    parameter_type: paramType,
    fbclid_short: state.shortId,
    tracking_id_length: trackingId.length,
    full_url: fullUrl,
    referrer: document.referrer || 'direct',
    timestamp: new Date().toISOString()
  });
} else {
  const last = loadLastAdSnapshot();
  if (last) {
    // Повторный заход без fbclid — продолжаем старый рекламный shortId
    state.shortId = last.shortId;
    state.trackingId = last.trackingId;
    state.paramType = last.paramType;
    state.record = last.record;
    state.path = `${T.adBranch}/${state.shortId}`;
  } else if (T.visitsBranch) {
    // Органика: запись в отдельную ветку, бот получает прежний NOFBCLID
    state.path = `${T.visitsBranch}/${generateShortId()}`;
    state.record = { ...buildRecord(null, 'none'), start_parameter: T.noTrackingStart };
  }

  fbqCustom('ProkladkaWithoutFbclid', {
    full_url: fullUrl,
    referrer: document.referrer || 'direct',
    timestamp: new Date().toISOString(),
    reason: last ? 'last_short_id_reused' : 'tracking_id_missing',
    fbclid_short: last ? last.shortId : null
  });
}

// Кнопки: на рекламном заходе включаются только после сохранения записи (см. ниже)
let locked = !!trackingId;
function unlockCta() {
  applyLinks();
  locked = false;
  window.__ctaReady = true;
  document.documentElement.classList.remove('cta-lock');
}
if (!locked) unlockCta();

const isFreshVisit = !!trackingId || (state.record && !state.record.fbclid_original);
if (state.record && isFreshVisit) {
  // 1) Сразу пишем базовую запись — она сохранится, даже если человек уйдёт, не дождавшись IP/гео
  const baseSaved = writeRecord(state.path, state.record)
    .catch((e) => logError('firebase_save', e.message, { short_id: state.shortId }));
  // 2) Дописываем IP/гео полной перезаписью (как раньше — без update())
  state.netReady = getIpAndGeo().then((net) => {
    if (!net) return;
    state.record = { ...state.record, ...networkFields(net) };
    saveLastAdSnapshot();
    return writeRecord(state.path, state.record);
  }).catch((e) => logError('firebase_geo', e.message, { short_id: state.shortId }));

  // 3) Рекламный заход: включаем кнопки, когда обе записи завершились (или через 8 с, если сеть зависла)
  if (locked) Promise.race([Promise.allSettled([baseSaved, state.netReady]), wait(8000)]).then(unlockCta);
}

// ---------- клик по любой кнопке «Играть» ----------
let navigating = false;

async function trackClick(ctaId) {
  if (!state.record) return;
  // Даём IP/гео шанс дописаться — они важны для EMQ
  await Promise.race([state.netReady, wait(1500)]);
  const link = botLink();
  const startParameter = link.split('?start=')[1] || 'NO_START_PARAM';
  const now = Date.now();
  state.record = {
    ...state.record,
    button_clicked: true,
    click_time: now,
    click_time_readable: new Date(now).toISOString(),
    telegram_link: link,
    start_parameter: startParameter,
    link_matches: state.shortId ? startParameter === state.shortId : false,
    time_on_page_ms: now - PAGE_LOAD_TIME,
    time_on_page_seconds: Math.round((now - PAGE_LOAD_TIME) / 1000),
    cta_id: ctaId || null,
    site_lang: document.documentElement.lang
  };
  saveLastAdSnapshot();
  // Полная перезапись восстанавливает запись, даже если бот её уже удалил
  await writeRecord(state.path, state.record);
}

document.addEventListener('click', async (e) => {
  const a = e.target.closest && e.target.closest('a[data-cta]');
  if (!a) return;
  e.preventDefault();
  if (locked || navigating) return; // locked — данные ещё сохраняются (клавиатура обходит pointer-events)
  navigating = true;

  fbqCustom('ClickTelegram', { cta: a.dataset.cta, club: C.id, fbclid_short: state.shortId });
  document.body.classList.add('is-leaving');

  const link = botLink();
  await Promise.race([
    trackClick(a.dataset.cta).catch((err) => logError('button_click', err.message, { short_id: state.shortId })),
    wait(3000)
  ]);
  window.location.assign(link);

  // Если человек вернулся назад — снова даём нажать
  setTimeout(() => { navigating = false; document.body.classList.remove('is-leaving'); }, 4000);
});

window.addEventListener('pageshow', (e) => {
  if (e.persisted) { navigating = false; document.body.classList.remove('is-leaving'); }
});

// Для отладки в консоли
window.__tracker = state;

  </script>
